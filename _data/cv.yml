        keywords: "Risk assessment, geospatial analytics"
      - name: Data & Programming
        keywords: "Python, SQL, machine learning"
      - name: GIS & BI
        keywords: "ArcGIS, QGIS, Power BI"
      - name: Development
        keywords: "GitLab, GitHub"
    Languages:
